<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CherryBox - Administrador de Archivos</title>
  <link rel="icon" type="image/svg+xml" href="public/cherries.svg" />
  <link rel="stylesheet" href="public/css/styles.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"></script>
  <script src="public/js/lib/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"
    integrity="sha512-YsR46MmyChktsyMMou+Bs74oCa/CDdwft7rJ5wlnmDzMj1mzqncsfJamEEf99Nk7IB0JpTMo5hS8rxB49FUktQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="icon" onclick="navigateTo('')" style="cursor: pointer">
        <h1>CherryBox</h1>
        <img src="public/cherries.svg" alt="CherryBox" width="50" height="50" />
      </div>
      <button class="btn btn-primary" style="border: solid 1px #bebebe" onclick="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-logout">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
          <path d="M9 12h12l-3 -3" />
          <path d="M18 15l3 -3" />
        </svg>
      </button>
    </div>
    <div class="card-storage">
      <div class="bar-storage-info">
        <span id="storageLimit" title="Total">-</span>
        <span id="storageUsed" title="Usado">-</span>
        <span id="storageAvailable" title="Disponible">-</span>
      </div>
      <div class="bar-storage">
        <div class="bar-storage-fill"></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-container">
        <form style="width:100%" id="search-form">
          <div class="search">
            <input type="search" id="searchInput" placeholder="Buscar archivos..." list="searchHistory" />
            <button class="btn btn-primary" type="submit">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                <path d="M21 21l-6 -6" />
              </svg>
            </button>
          </div>
        </form>
      </div>
      <div class="breadcrumb" id="breadcrumb">
        <span onclick="navigateTo('')">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-home">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
            <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
          </svg>
        </span>
      </div>
      <button class="btn btn-danger" id="btn-deleteSelectedFiles" title="Eliminar seleccionados"
        onclick="deleteSelectedFiles()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-trash">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M4 7l16 0" />
          <path d="M10 11l0 6" />
          <path d="M14 11l0 6" />
          <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
          <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
        </svg>
      </button>
      <button class="btn btn-secondary" id="btn-downloadSelectedFiles" title="Descargar seleccionados"
        onclick="downloadSelectedFiles()" style="display: none">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-download">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
          <path d="M7 11l5 5l5 -5" />
          <path d="M12 4l0 12" />
        </svg>
      </button>
      <button class="btn btn-secondary" id="btn-refreshFiles" title="Actualizar" onclick="refreshpath()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-refresh">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
          <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
        </svg>
      </button>
      <button class="btn btn-secondary" title="Crear Carpeta" onclick="showCreateFolderModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-folder-plus">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M12 19h-7a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v3.5" />
          <path d="M16 19h6" />
          <path d="M19 16v6" />
        </svg>
      </button>
      <button class="btn btn-secondary" id="btn-folderPermissions" onclick="showCurrentFolderPermissions()"
        title="Permisos de esta carpeta">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-lock">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
          <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
          <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
        </svg>
      </button>
      <button class="btn btn-secondary" id="btn-upload" title="Subir Archivo"
        onclick="document.getElementById('fileInput').click()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-file-upload">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M14 3v4a1 1 0 0 0 1 1h4" />
          <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" />
          <path d="M12 11v6" />
          <path d="M9.5 13.5l2.5 -2.5l2.5 2.5" />
        </svg>
      </button>
      <input type="file" id="fileInput" multiple onchange="uploadFiles(event)" />
      <button class="btn btn-music-player" title="CherryJam" id="btn-music-player" onclick="readyPlayerMusic()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-vinyl">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M16 3.937a9 9 0 1 0 5 8.063" />
          <path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
          <path d="M19 4a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
          <path d="M20 4l-3.5 10l-2.5 2" />
        </svg>
      </button>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="toolbar" id="admin-actions" style="justify-content: end">
      <a title="settings" class="btn btn-secondary" href="/settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-settings">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path
            d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" />
          <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
        </svg>
      </a>
      <a title="usuarios" class="btn btn-secondary" href="/users">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-users">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
          <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
        </svg>
      </a>
      <a title="logs" class="btn btn-secondary" href="/logs">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-logs">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M4 12h.01" />
          <path d="M4 6h.01" />
          <path d="M4 18h.01" />
          <path d="M8 18h2" />
          <path d="M8 12h2" />
          <path d="M8 6h2" />
          <path d="M14 6h6" />
          <path d="M14 12h6" />
          <path d="M14 18h6" />
        </svg>
      </a>
    </div>
  </div>
  <!-- Indicador de progreso de subida -->
  <div class="upload-progress" id="uploadProgress">
    <div class="progress-header">
      <span>Subiendo archivos</span>
      <div style="display: flex; gap: 10px; align-items: center">
        <span class="file-count" id="fileCount">0/0</span>
        <button class="btn-cancel-all" id="cancelAllBtn" onclick="cancelAllUploads()"
          title="Cancelar todas las subidas">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M18 6l-12 12" />
            <path d="M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
    <div class="total-progress-container">
      <div class="progress-bar total-bar">
        <div class="progress-fill" id="totalProgressFill" style="width: 0%"></div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px">
        <span id="totalProgressText">0%</span>
        <span id="uploadSpeed">0 KB/s</span>
      </div>
    </div>
    <div id="progressList"></div>
  </div>

  <!-- Modal para crear carpeta -->
  <div class="modal" id="createFolderModal">
    <div class="modal-content">
      <div class="modal-header">Nueva Carpeta</div>
      <form action="" id="create-folder-form">
        <div class="form-group">
          <label>Nombre de la carpeta:</label>
          <input type="text" id="folderNameInput" placeholder="Mi carpeta" />
        </div>
        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
          <label>Color de la carpeta:</label>
          <input type="color" id="folderColorInput" placeholder="Mi carpeta" value="#FFE36C" />
        </div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal(currentModalActive)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-x">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M18 6l-12 12" />
              <path d="M6 6l12 12" />
            </svg>
            <p class="acction-text">Cancelar</p>
          </button>
          <button class="btn btn-primary" type="submit">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-folder-plus">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M12 19h-7a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v3.5" />
              <path d="M16 19h6" />
              <path d="M19 16v6" />
            </svg>
            <p class="acction-text">Crear</p>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para renombrar -->
  <div class="modal" id="renameModal">
    <div class="modal-content">
      <div class="modal-header">Renombrar</div>
      <form action="" id="rename-file-form">
        <div class="form-group">
          <label>Nuevo nombre:</label>
          <input type="text" id="renameInput" />
        </div>
        <div id="colorFolderCustom" class="form-group"
          style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
          <label>Color de la carpeta:</label>
          <input type="color" id="renameColorInput" placeholder="Mi carpeta" value="#FFE36C" />
        </div>
        <div class="modal-actions">
          <button class="btn" type="button" onclick="closeModal(currentModalActive)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-x">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M18 6l-12 12" />
              <path d="M6 6l12 12" />
            </svg>
            <p class="acction-text">Cancelar</p>
          </button>
          <button class="btn btn-primary" type="submit">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-device-floppy">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2" />
              <path d="M10 14a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
              <path d="M14 4l0 4l-6 0l0 -4" />
            </svg>
            <p class="acction-text">Guardar</p>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para vista previa -->
  <div class="modal" id="previewModal">
    <div class="modal-content preview-modal">
      <div class="modal-header" id="previewTitle">
        Vista Previa
      </div>
      <div class="preview-content" id="previewContent">
        <div class="preview-loading"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal(currentModalActive)">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-x">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M18 6l-12 12" />
            <path d="M6 6l12 12" />
          </svg>
          <p class="acction-text">Cerrar</p>
        </button>
        <button class="btn btn-primary" onclick="downloadFile(currentPreviewPath)">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-download">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
            <path d="M7 11l5 5l5 -5" />
            <path d="M12 4l0 12" />
          </svg>
          <p class="acction-text">Descargar</p>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal para gestionar permisos -->
  <div class="modal" id="permissionsModal">
    <div class="modal-content" style="max-width: 500px">
      <div class="modal-header">
        <span style="flex-shrink: 0">Gestionar Permisos: </span>
        <span id="permFileName" style="
              font-weight: 400;
              text-overflow: ellipsis;
              white-space: nowrap;
              overflow: hidden;
              min-width: 0;
              flex: 1;
            "></span>
      </div>

      <div id="permissionsList" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto">
        <!-- Lista de permisos cargada dinámicamente -->
      </div>

      <div class="modal-header" style="font-size: 1rem; border-bottom: none; padding-bottom: 5px">
        Añadir Acceso
      </div>
      <form id="permissions-form">
        <div class="form-group">
          <label>ID de Usuario o Email:</label>
          <input type="text" id="targetUserId" name="targetUserId" placeholder="ID del usuario o email" />
        </div>
        <div class="form-group">
          <label>Nivel de Acceso:</label>
          <select id="accessLevel" class="btn btn-secondary" name="accessLevel"
            style="width: 100%; text-align: left; padding: 10px">
            <option value="READ">Lectura (Ver y descargar)</option>
            <option value="WRITE">Escritura (Modificar y renombrar)</option>
            <option value="DELETE">Eliminación (Borrar permanentemente)</option>
            <option value="MANAGE">Administración (Gestionar permisos)</option>
          </select>
        </div>

        <div class="modal-actions" style="margin-top: 20px">
          <button class="btn" onclick="closeModal(currentModalActive)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-x">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M18 6l-12 12" />
              <path d="M6 6l12 12" />
            </svg>
            <p class="acction-text">Cerrar</p>
          </button>
          <button class="btn btn-primary" type="submit">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-user-plus">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
              <path d="M16 19h6" />
              <path d="M19 16v6" />
              <path d="M6 21v-2a4 4 0 0 1 4 -4h4c.338 0 .659 .042 .965 .12" />
            </svg>
            <p class="acction-text">Otorgar</p>
          </button>
        </div>
      </form>
    </div>
  </div>
  <div class="modal" id="musicPlayerModal">
    <div class="modal-content-player" style="max-width: 500px">
      <div class="modal-header-player">
        <button id="playMusic" class="btn-player">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
            class="icon icon-tabler icons-tabler-filled icon-tabler-player-play" viewBox="0 0 24 24">
            <path fill="none" d="M0 0h24v24H0z" />
            <path d="M6 4v16a1 1 0 0 0 1.524.852l13-8a1 1 0 0 0 0-1.704l-13-8A1 1 0 0 0 6 4" />
          </svg>
        </button>
        <button id="pauseMusic" class="btn-player" style="display: none">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
            class="icon icon-tabler icons-tabler-filled icon-tabler-player-pause" viewBox="0 0 24 24">

      <div class="modal-actions-player">
        <input type="range" id="progressBar" class="progressMusic" value="0" min="0" max="100" />

        <button class="btn-player" id="miniplayerPlay">

            <path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" />

            class="icon icon-tabler icons-tabler-filled icon-tabler-player-pause">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M9 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z" />

          </svg>
        </button>
        <div class="miniplayer-slider" id="miniplayerShow">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
