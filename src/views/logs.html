<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CherryBox - Administrador de Archivos</title>
    <link rel="icon" type="image/svg+xml" href="public/cherries.svg">
    <link rel="stylesheet" href="public/css/styles.css">
    <link rel="stylesheet" href="public/css/logs.css">
    <link rel="stylesheet" href="public/css/atom-one-dark.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <script src="public/js/lib/axios.min.js"></script>
    <style>
        /* Estilos para el lenguaje de log personalizado */
        .hljs-date {
            color: #6272a4;
        }

        .hljs-error {
            color: #ff5555;
            font-weight: bold;
        }

        .hljs-warn {
            color: #ffb86c;
        }

        .hljs-info {
            color: #50fa7b;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon">
                <h1>CherryBox</h1>
                <img src="public/cherries.svg" alt="CherryBox" width="50" height="50">
            </div>
            <button class="btn btn-primary" style="border: solid 1px #bebebe;" onclick="logout()"><svg
                    xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-logout">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
                    <path d="M9 12h12l-3 -3" />
                    <path d="M18 15l3 -3" />
                </svg></button>
        </div>

        <div class="logs-wrapper">
            <div class="header-container">
                <div class="title-group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-logs">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M4 12h.01" />
                        <path d="M4 6h.01" />
                        <path d="M4 18h.01" />
                        <path d="M8 18h2" />
                        <path d="M8 12h2" />
                        <path d="M8 6h2" />
                        <path d="M14 6h6" />
                        <path d="M14 12h6" />
                        <path d="M14 18h6" />
                    </svg>
                    <h1 class="title">Logs</h1>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="dropdown">
                        <button class="dropbtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="icon icon-tabler icons-tabler-outline icon-tabler-dots-circle-horizontal">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
                                <path d="M8 12l0 .01" />
                                <path d="M12 12l0 .01" />
                                <path d="M16 12l0 .01" />
                            </svg>
                            Opciones</button>
                        <div class="dropdown-content">
                            <a href="/users">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="icon icon-tabler icons-tabler-outline icon-tabler-users">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                                    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                                    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
                                </svg>
                                Usuarios</a>
                            <a href="/settings">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="icon icon-tabler icons-tabler-outline icon-tabler-settings">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path
                                        d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" />
                                    <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
                                </svg>
                                Configuración</a>
                            <a href="/">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="icon icon-tabler icons-tabler-outline icon-tabler-home">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
                                    <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
                                    <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
                                </svg>
                                Home</a>
                        </div>
                    </div>
                    <select id="logTypeSelect" class="log-select">
                        <option value="combined">Logs Combinados</option>
                        <option value="error">Logs de Errores</option>
                    </select>
                </div>
            </div>
            <div class="logs-container">
                <pre id="logs"></pre>
            </div>
        </div>
        <script src="public/js/lib/highlight.min.js"></script>
        <p id="userId" style="position: fixed; bottom: 5px; left: 5px; color: white; font-size: 0.7rem;">-</p>
        <div id="toast-container"></div>
        <script src="public/js/info-user.js"></script>
        <script>
            // Registrar un lenguaje personalizado para logs
            hljs.registerLanguage('log', function (hljs) {
                return {
                    name: 'Log',
                    contains: [
                        { className: 'date', begin: /\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/ },
                        { className: 'info', begin: /\binfo\b/ },
                        { className: 'warn', begin: /\bwarn\b/ },
                        { className: 'error', begin: /\berror\b/ }
                    ]
                };
            });
            // Inicializar highlight.js
            hljs.highlightAll();
        </script>
        <script src="public/js/toast.js"></script>
        <script src="public/js/logs.js"></script>
        <script src="public/js/logout.js"></script>
</body>

</html>
