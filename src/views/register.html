<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CherryBox</title>
    <link rel="icon" type="image/svg+xml" href="public/cherries.svg">
    <link rel="stylesheet" href="public/css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <script src="public/js/lib/axios.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon">
                <h1>CherryBox</h1>
                <img src="public/cherries.svg" alt="CherryBox" width="50" height="50">
            </div>
            <a title="home" class="btn btn-primary" style="max-width: 50px; border: solid 1px #bebebe;" href="/">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-home">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
                    <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
                    <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
                </svg>
            </a>
        </div>
        <div class="auth-container">
            <div class="image">
                <img src="public/img/back.png" alt="CherryBox">
            </div>
            <div class="form-wrapper">
                <h2>Crear Cuenta</h2>
                <p>Regístrate para empezar a gestionar tus archivos.</p>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="passwordConfirm">Repetir Contraseña</label>
                        <input type="password" name="passwordConfirm" id="passwordConfirm" placeholder="••••••••"
                            required>
                    </div>
                    <button class="btn btn-primary" type="submit">Registrarse</button>
                </form>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>
    <script src="public/js/toast.js"></script>
    <script src="public/js/auth.js"></script>
</body>

</html>
