<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CherryBox</title>
    <link rel="icon" type="image/svg+xml" href="public/cherries.svg">
    <link rel="stylesheet" href="public/css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <script src="public/js/lib/axios.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>CherryBox 🍒</h1>
        </div>
        <div class="auth-container">
            <div class="image">
                <img src="public/img/back.png" alt="CherryBox">
            </div>
            <div class="form-wrapper">
                <h2>Crear Cuenta</h2>
                <p>Regístrate para empezar a gestionar tus archivos.</p>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="passwordConfirm">Repetir Contraseña</label>
                        <input type="password" name="passwordConfirm" id="passwordConfirm" placeholder="••••••••"
                            required>
                    </div>
                    <button class="btn btn-primary" type="submit">Registrarse</button>
                </form>
            </div>
        </div>
    </div>
    <script src="public/js/auth.js"></script>
</body>

</html>
