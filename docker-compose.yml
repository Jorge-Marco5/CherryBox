version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: cherrybox_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-cherrybox_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cherrybox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cherrybox_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_DIR: /app/archivos
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-cherrybox_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-cherrybox_secret_key_change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-500}
      MAX_FILES: ${MAX_FILES:-50}
      FRONTEND_URL: ${FRONTEND_URL:-*}
    volumes:
      - ./archivos:/app/archivos
      - cherrybox_persistent:/app/dist/persistent
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  cherrybox_persistent:
    driver: local
